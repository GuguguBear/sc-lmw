name: Publish Starfix

on:
  push:
    branches: [master]
    paths:
      - "companion/**"
      - ".github/workflows/starfix-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starfix-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the Starfix version
        id: ver
        working-directory: companion
        shell: pwsh
        run: |
          $v = (Get-Content -Raw VERSION).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "companion/VERSION must look like 1.2.3" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: See if this version is already published
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "starfix-${{ steps.ver.outputs.version }}"
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $resp = Invoke-WebRequest -Headers $headers -Uri $uri -SkipHttpErrorCheck
          if ($resp.StatusCode -eq 200) {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag is already published and is left unchanged."
          } elseif ($resp.StatusCode -eq 404) {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Release $tag is not published yet."
          } else {
            Write-Host $resp.Content
            exit 1
          }
          exit 0
      - name: Build Starfix.exe
        if: steps.rel.outputs.exists != 'true'
        working-directory: companion
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python write_version_info.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Starfix --icon icon.ico --version-file file_version.txt --hidden-import history --add-data "icon.png;." --add-data "icon.ico;." --add-data "index.html;." --add-data "VERSION;." --add-data "..\css\starmap.css;css" app.py
      - name: Publish the release
        if: steps.rel.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: starfix-${{ steps.ver.outputs.version }}
          name: Starfix ${{ steps.ver.outputs.version }}
          make_latest: true
          files: companion/dist/Starfix.exe
          body: |
            Starfix ${{ steps.ver.outputs.version }}
            Windows build of the optional log reader. The source is in companion/.
            It only reads Game.log on the computer where you run it.
            The program compares this version with GitHub Releases when it starts.
            The Microsoft Store package does not. It keeps its settings in LocalAppData and is updated by the Store.
          generate_release_notes: false
      - name: See whether the Store identity is ready
        id: store
        shell: pwsh
        run: |
          $id = Get-Content -Raw companion\store-identity.json | ConvertFrom-Json
          $ready = [bool]($id.productId -and $id.identityName -and $id.publisher -and $id.publisherDisplayName)
          if ($ready) { "ready=true" >> $env:GITHUB_OUTPUT } else { "ready=false" >> $env:GITHUB_OUTPUT }
          if (-not $ready) {
            Write-Host "companion/store-identity.json is empty. The GitHub release stands. The Store package waits until that file has the product id, identity name, publisher, and publisher display name."
          }
      - name: Use the published exe for the Store package
        if: ${{ success() && steps.store.outputs.ready == 'true' }}
        shell: pwsh
        run: |
          $exe = "companion\dist\Starfix.exe"
          if (Test-Path $exe) { exit 0 }
          New-Item -ItemType Directory -Path companion\dist -Force | Out-Null
          $url = "https://github.com/GuguguBear/sc-lmw/releases/download/starfix-${{ steps.ver.outputs.version }}/Starfix.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
      - name: Pack the Store package
        if: ${{ success() && steps.store.outputs.ready == 'true' }}
        shell: powershell
        run: |
          $id = Get-Content -Raw companion\store-identity.json | ConvertFrom-Json
          & .\companion\pack-store.ps1 -Exe .\companion\dist\Starfix.exe -Icon .\companion\icon.png -Version "${{ steps.ver.outputs.version }}" -IdentityName $id.identityName -Publisher $id.publisher -PublisherDisplayName $id.publisherDisplayName -Out .\companion\dist\Starfix.msix
      - name: Attach the Store package to the GitHub release
        if: ${{ success() && steps.store.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "starfix-${{ steps.ver.outputs.version }}" companion/dist/Starfix.msix --clobber
      - name: Install the Microsoft Store CLI
        if: ${{ success() && steps.store.outputs.ready == 'true' }}
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "msstore.zip"
          $dest = Join-Path $env:RUNNER_TEMP "msstore"
          Invoke-WebRequest -Uri "https://github.com/microsoft/msstore-cli/releases/download/v0.4.4/MSStoreCLI-win-x64.zip" -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem $dest -Recurse -Filter msstore.exe | Select-Object -First 1
          if (-not $exe) { throw "The Store CLI zip did not contain an exe." }
          "$($exe.DirectoryName)" >> $env:GITHUB_PATH
      - name: Publish the Store package
        if: ${{ success() && steps.store.outputs.ready == 'true' }}
        shell: powershell
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER: ${{ secrets.SELLER_ID }}
        run: |
          if (-not $env:TENANT -or -not $env:CLIENT -or -not $env:SECRET -or -not $env:SELLER) {
            throw "Add the Partner Center secrets AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID, AZURE_AD_APPLICATION_SECRET, and SELLER_ID."
          }
          $id = Get-Content -Raw companion\store-identity.json | ConvertFrom-Json
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed." }
          msstore publish . --inputDirectory companion\dist --appId $id.productId
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed." }
