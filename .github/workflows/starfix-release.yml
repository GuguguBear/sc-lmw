name: Publish Starfix

on:
  push:
    branches: [master]
    paths:
      - "companion/**"
      - ".github/workflows/starfix-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starfix-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Starfix.exe
        working-directory: companion
        run: |
          python -m pip install --disable-pip-version-check pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Starfix --icon icon.ico --add-data "icon.png;." --add-data "icon.ico;." --add-data "index.html;." --add-data "..\css\starmap.css;css" app.py
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: starfix-${{ github.sha }}
          name: Starfix
          make_latest: true
          files: companion/dist/Starfix.exe
          body: |
            Windows build of the optional log reader. The source is in companion/.
            It only reads Game.log on the computer where you run it.
          generate_release_notes: false
