name: Update the live site

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Wrangler
        run: npm ci
      - name: Stage the public site
        run: python3 scripts/stage_site.py
      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f1bc2c35209fc5a627f8b92e33f5a43a
          wranglerVersion: "4.165.0"
          command: deploy
